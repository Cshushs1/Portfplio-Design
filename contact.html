<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact — Chang Shu</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #111111;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       PAGE
    ========================== */

    .contact-page {
      position: relative;
      width: 100%;
      min-height: 100vh;

      padding: 42px;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       NAVIGATION
    ========================== */

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;

      width: 100%;

      font-size: 12px;
      font-weight: 400;

      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .location {
      white-space: nowrap;
      transition: opacity 0.25s ease;
    }

    .location:hover {
      opacity: 0.4;
    }

    .navigation {
      display: flex;
      gap: 46px;
    }

    .navigation a {
      transition: opacity 0.25s ease;
    }

    .navigation a:hover {
      opacity: 0.4;
    }

    .navigation .active {
      position: relative;
    }

    .navigation .active::after {
      content: "";

      position: absolute;
      left: 0;
      bottom: -9px;

      width: 100%;
      height: 1px;

      background: #d71920;
    }

    /* =========================
       MAIN
    ========================== */

    .contact-main {
      flex: 1;

      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      align-items: center;

      gap: 8vw;

      padding: 90px 4vw 80px;
    }

    /* =========================
       LEFT
    ========================== */

    .contact-intro {
      align-self: center;
    }

    .eyebrow {
      margin-bottom: 32px;

      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .title {
      font-size: clamp(78px, 9vw, 165px);
      font-weight: 300;

      letter-spacing: -0.075em;
      line-height: 0.82;
    }

    .title span {
      display: block;
    }

    .description {
      margin-top: 65px;

      max-width: 440px;

      font-size: 17px;
      font-weight: 300;

      line-height: 1.55;
      letter-spacing: -0.01em;

      color: #333333;
    }

    /* =========================
       CONTACT LINKS
    ========================== */

    .contact-links {
      width: 100%;
      max-width: 680px;

      justify-self: end;
    }

    .contact-item {
      display: grid;

      grid-template-columns: 145px 1fr auto;
      align-items: center;

      min-height: 105px;

      border-top: 1px solid #d8d8d8;

      transition:
        padding-left 0.3s ease,
        opacity 0.25s ease;
    }

    .contact-item:last-child {
      border-bottom: 1px solid #d8d8d8;
    }

    .contact-item:hover {
      padding-left: 10px;
    }

    .contact-label {
      font-size: 10px;
      font-weight: 400;

      letter-spacing: 0.20em;
      text-transform: uppercase;

      color: #777777;
    }

    .contact-value {
      font-size: clamp(20px, 1.8vw, 30px);
      font-weight: 300;

      letter-spacing: -0.025em;
    }

    .contact-arrow {
      font-size: 24px;
      font-weight: 300;

      transition: transform 0.3s ease;
    }

    .contact-item:hover .contact-arrow {
      transform: translate(6px, -4px);
    }

    /* =========================
       FOOTER
    ========================== */

    .footer {
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      padding-top: 24px;

      font-size: 10px;

      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .availability {
      display: flex;
      align-items: center;

      gap: 16px;
    }

    .red-line {
      width: 42px;
      height: 1px;

      background: #d71920;
    }

    .footer-right {
      display: flex;
      gap: 45px;
    }

    .footer a {
      transition: opacity 0.25s ease;
    }

    .footer a:hover {
      opacity: 0.4;
    }

    /* =========================
       TABLET
    ========================== */

    @media (max-width: 1000px) {

      .contact-main {
        grid-template-columns: 1fr;

        align-items: start;

        gap: 100px;

        padding-top: 140px;
      }

      .contact-links {
        max-width: none;

        justify-self: stretch;
      }

      .title {
        font-size: clamp(85px, 15vw, 150px);
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 650px) {

      .contact-page {
        padding: 22px 18px;
      }

      .top-nav {
        align-items: flex-start;

        font-size: 9px;
      }

      .navigation {
        gap: 13px;
      }

      .contact-main {
        padding: 110px 0 90px;

        gap: 90px;
      }

      .eyebrow {
        margin-bottom: 24px;

        font-size: 9px;
      }

      .title {
        font-size: clamp(72px, 22vw, 110px);
      }

      .description {
        margin-top: 45px;

        max-width: 330px;

        font-size: 15px;
      }

      .contact-item {
        grid-template-columns: 90px 1fr auto;

        min-height: 88px;
      }

      .contact-label {
        font-size: 8px;
      }

      .contact-value {
        font-size: 16px;
      }

      .contact-arrow {
        font-size: 19px;
      }

      .footer {
        flex-direction: column;

        align-items: flex-start;

        gap: 35px;
      }

      .footer-right {
        width: 100%;

        justify-content: space-between;
      }
    }

  </style>
</head>


<body>

    <!-- =========================

    ========================== -->

    <footer class="footer">

      <div class="availability">

        </span>

      </div>


      <div class="footer-right">

        <a href="index.html">

        </a>

        <span>
          © 2026
        </span>

      </div>

    </footer>


  </main>

</body>
</html>
