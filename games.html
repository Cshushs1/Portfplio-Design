<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Game projects by Chang Shu."
  >

  <link
    rel="icon"
    type="image/png"
    href="favicon.png?v=2"
  >

  <link
    rel="shortcut icon"
    type="image/png"
    href="favicon.png?v=2"
  >

  <link
    rel="stylesheet"
    href="css/work.css"
  >


  <style>

    /* ==================================================
       PROJECT COVER
    ================================================== */

    .project-cover-link {
      position: relative;

      display: block;

      width: 100%;

      margin-top: 58px;

      overflow: hidden;

      background: #111;

      color: #fff;
      text-decoration: none;

      cursor: pointer;
    }


    .project-cover-image {
      display: block;

      width: 100%;
      height: auto;

      aspect-ratio: 16 / 7;

      object-fit: cover;
      object-position: center;

      transform: scale(1);

      transition:
        transform 0.9s cubic-bezier(.2,.65,.3,1),
        filter 0.45s ease;
    }


    /* ==================================================
       COVER OVERLAY
    ================================================== */

    .project-cover-link::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 1;

      background: rgba(0, 0, 0, 0);

      transition: background 0.4s ease;

      pointer-events: none;
    }


    /* ==================================================
       VIEW PROJECT
    ================================================== */

    .project-cover-label {
      position: absolute;

      right: 28px;
      bottom: 25px;

      z-index: 2;

      display: flex;
      align-items: center;

      gap: 12px;

      font-size: 10px;
      font-weight: 400;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      opacity: 0;

      transform: translateY(8px);

      transition:
        opacity 0.35s ease,
        transform 0.35s ease;
    }


    .project-cover-arrow {
      display: inline-block;

      font-size: 16px;

      transition: transform 0.35s ease;
    }


    /* ==================================================
       HOVER
    ================================================== */

    .project-cover-link:hover
    .project-cover-image {
      transform: scale(1.018);
    }


    .project-cover-link:hover::after {
      background: rgba(0, 0, 0, 0.13);
    }


    .project-cover-link:hover
    .project-cover-label {
      opacity: 1;

      transform: translateY(0);
    }


    .project-cover-link:hover
    .project-cover-arrow {
      transform: translate(4px, -4px);
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 800px) {

      .project-cover-link {
        margin-top: 40px;
      }


      .project-cover-image {
        aspect-ratio: 16 / 9;
      }


      .project-cover-label {
        right: 18px;
        bottom: 17px;

        opacity: 1;

        transform: none;

        font-size: 8px;
      }

    }


    @media (max-width: 600px) {

      .project-cover-image {
        aspect-ratio: 4 / 3;
      }

    }


    /* ==================================================
       REDUCED MOTION
    ================================================== */

    @media (prefers-reduced-motion: reduce) {

      .project-cover-image {
        transition: none;
      }


      .project-cover-link:hover
      .project-cover-image {
        transform: none;
      }

    }

  </style>

</head>
