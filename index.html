<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chang Shu — Portfolio</title>

  <style>
    /* ==============================
       RESET
    ============================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* ==============================
       HOMEPAGE
    ============================== */

    .home {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }


    /* ==============================
       TOP NAVIGATION
    ============================== */

    .top-nav {
      position: absolute;
      top: 38px;
      left: 42px;
      right: 42px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 10;

      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .location {
      text-transform: uppercase;
    }

    .navigation {
      display: flex;
      gap: 48px;
    }

    .navigation a {
      position: relative;
      transition: opacity 0.25s ease;
    }

    .navigation a:hover {
      opacity: 0.45;
    }


    /* ==============================
       COLLAGE
    ============================== */

    .artwork {
      position: absolute;

      left: 8%;
      top: -2%;

      width: 43%;
      height: 105%;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      overflow: visible;
    }

    .artwork img {
      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center top;

      display: block;
    }


    /* ==============================
       MAIN INFORMATION
    ============================== */

    .intro {
      position: absolute;

      left: 52%;
      top: 38%;

      width: 39%;

      z-index: 5;
    }


    /* NAME */

    .name {
      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-size: clamp(72px, 8vw, 145px);
      font-weight: 300;

      letter-spacing: -0.065em;
      line-height: 0.9;

      white-space: nowrap;
    }


    /* DISCIPLINE */

    .discipline {
      margin-top: 22px;

      font-size: 12px;
      letter-spacing: 0.18em;

      text-transform: uppercase;
    }


    /* STATEMENT */

    .statement {
      margin-top: 85px;

      max-width: 430px;

      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;

      font-size: 16px;
      line-height: 1.45;

      color: #303030;
    }


    /* ==============================
       ENTER
    ============================== */

    .enter {
      margin-top: 62px;

      display: flex;
      align-items: center;

      width: 330px;

      cursor: pointer;
    }

    .enter-label {
      font-size: 12px;
      letter-spacing: 0.18em;
    }

    .arrow {
      margin-left: 28px;

      font-size: 25px;
      font-weight: 300;

      transition: transform 0.3s ease;
    }

    .enter-line {
      flex: 1;

      height: 1px;

      margin-left: 22px;

      background: #1b1b1b;
    }

    .enter:hover .arrow {
      transform: translateX(8px);
    }


    /* ==============================
       SMALL ACCENT
    ============================== */

    .red-accent {
      position: absolute;

      left: 42px;
      bottom: 70px;

      width: 42px;
      height: 1px;

      background: #c91919;
    }


    /* ==============================
       YEAR
    ============================== */

    .year {
      position: absolute;

      left: 42px;
      bottom: 38px;

      font-size: 11px;
      letter-spacing: 0.12em;
    }


    /* ==============================
       IMAGE MICRO INTERACTION
    ============================== */

    .artwork img {
      transition:
        transform 0.8s cubic-bezier(.2,.8,.2,1);
    }

    .artwork:hover img {
      transform: scale(1.012);
    }


    /* ==============================
       TABLET
    ============================== */

    @media (max-width: 1100px) {

      .artwork {
        left: 3%;
        width: 48%;
      }

      .intro {
        left: 51%;
        width: 44%;
      }

      .name {
        font-size: clamp(62px, 9vw, 110px);
      }

      .navigation {
        gap: 25px;
      }

    }


    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 760px) {

      .home {
        min-height: auto;
        overflow: visible;

        padding-bottom: 70px;
      }


      /* NAV */

      .top-nav {
        position: relative;

        top: auto;
        left: auto;
        right: auto;

        padding: 24px 20px;

        align-items: flex-start;
      }

      .location {
        font-size: 10px;
      }

      .navigation {
        gap: 16px;
        font-size: 10px;
      }


      /* IMAGE */

      .artwork {
        position: relative;

        left: auto;
        top: auto;

        width: 90%;
        height: auto;

        margin: 10px auto 0;
      }

      .artwork img {
        width: 100%;
        height: auto;

        object-fit: contain;
      }


      /* INTRO */

      .intro {
        position: relative;

        left: auto;
        top: auto;

        width: auto;

        margin: 45px 20px 0;
      }

      .name {
        font-size: clamp(60px, 18vw, 100px);

        white-space: normal;

        line-height: 0.92;
      }

      .discipline {
        margin-top: 18px;
        font-size: 10px;
      }

      .statement {
        margin-top: 55px;

        max-width: 320px;

        font-size: 15px;
      }

      .enter {
        margin-top: 45px;

        width: 100%;
        max-width: 330px;
      }


      /* FOOTER DETAILS */

      .red-accent {
        display: none;
      }

      .year {
        position: relative;

        left: auto;
        bottom: auto;

        margin: 80px 20px 0;

        font-size: 10px;
      }

    }

  </style>
</head>


<body>

  <main class="home">


    <!-- =========================
         TOP NAVIGATION
    ========================== -->

    <header class="top-nav">

      <div class="location">
        New York / Hong Kong
      </div>

      <nav class="navigation">

        <!--
        后面把 work.html
        换成你的正式作品页面
        -->

        <a href="work.html">
          Work
        </a>

        <a href="information.html">
          Information
        </a>

        <a href="mailto:cshushs1@gmail.com">
          Contact
        </a>

      </nav>

    </header>



    <!-- =========================
         HERO ARTWORK
    ========================== -->

    <div class="artwork">

      <!--
      把你的 collage 图片上传到 GitHub
      和 index.html 放在同一层

      文件名：
      homepage-collage.png
      -->

      <img
        src="homepage-collage.png"
        alt="Chang Shu portfolio collage artwork"
      />

    </div>



    <!-- =========================
         MAIN INTRO
    ========================== -->

    <section class="intro">

      <h1 class="name">
        Chang Shu
      </h1>


      <p class="discipline">
        Interaction · Digital Media · Visual Art
      </p>


      <p class="statement">
        Between reality and imagination,<br>
        I build spaces to feel, to question, and to play.
      </p>


      <!-- ENTER -->

      <a
        href="work.html"
        class="enter"
        aria-label="Enter selected work"
      >

        <span class="enter-label">
          ENTER
        </span>

        <span class="arrow">
          →
        </span>

        <span class="enter-line"></span>

      </a>

    </section>



    <!-- =========================
         SMALL DETAILS
    ========================== -->

    <div class="red-accent"></div>

    <div class="year">
      2026
    </div>


  </main>

</body>
</html>
