<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chang Shu — Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #111111;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HOMEPAGE
    ========================== */

    .home {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 650px;
      overflow: hidden;
      background: #ffffff;
    }


    /* =========================
       NAVIGATION
    ========================== */

    .top-nav {
      position: absolute;
      top: 42px;
      left: 42px;
      right: 42px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 20;

      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .navigation {
      display: flex;
      gap: 46px;
    }

    .navigation a {
      transition: opacity 0.25s ease;
    }

    .navigation a:hover {
      opacity: 0.4;
    }


    /* =========================
       COLLAGE
    ========================== */

    .artwork {
      position: absolute;

      left: 5.5%;
      top: 0;
      bottom: 0;

      width: 51%;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      z-index: 1;
      pointer-events: none;
    }

    .artwork img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center bottom;

      transform-origin: center bottom;
    }


    /* =========================
       INTRO
    ========================== */

    .intro {
      position: absolute;

      left: 57%;
      top: 50%;

      width: 38%;
      max-width: 700px;

      transform: translateY(-42%);

      z-index: 10;
    }


    /* =========================
       NAME
    ========================== */

    .name {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

      font-size: clamp(72px, 8.2vw, 150px);
      font-weight: 300;

      letter-spacing: -0.065em;
      line-height: 0.88;

      white-space: nowrap;
    }


    /* =========================
       DISCIPLINE
    ========================== */

    .discipline {
      margin-top: 28px;

      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0.24em;
      text-transform: uppercase;

      white-space: nowrap;
    }


    /* =========================
       STATEMENT
    ========================== */

    .statement {
      margin-top: 70px;

      width: 100%;
      max-width: 520px;

      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

      font-size: 17px;
      font-weight: 300;

      font-style: normal;

      line-height: 1.55;
      letter-spacing: -0.01em;

      color: #303030;
    }


    /* =========================
       ENTER
    ========================== */

    .enter {
      margin-top: 60px;

      width: 360px;

      display: flex;
      align-items: center;

      cursor: pointer;
    }

    .enter-label {
      font-size: 11px;
      font-weight: 400;

      letter-spacing: 0.22em;
    }

    .enter-line {
      height: 1px;
      flex: 1;

      margin-left: 26px;

      background: #222222;
    }

    .arrow {
      margin-left: 16px;

      font-size: 24px;
      font-weight: 300;

      transition: transform 0.3s ease;
    }

    .enter:hover .arrow {
      transform: translateX(8px);
    }


    /* =========================
       YEAR
    ========================== */

    .year-area {
      position: absolute;

      left: 42px;
      bottom: 35px;

      z-index: 10;
    }

    .red-line {
      width: 42px;
      height: 1px;

      margin-bottom: 14px;

      background: #d71920;
    }

    .year {
      font-size: 10px;

      letter-spacing: 0.16em;
    }


    /* =========================
       MEDIUM DESKTOP
    ========================== */

    @media (max-width: 1250px) {

      .artwork {
        left: 2%;
        width: 55%;
      }

      .intro {
        left: 56%;
        width: 40%;
      }

      .name {
        font-size: clamp(68px, 8vw, 110px);
      }

      .statement {
        margin-top: 55px;
      }

      .enter {
        margin-top: 50px;
      }
    }


    /* =========================
       TABLET
    ========================== */

    @media (max-width: 900px) {

      body {
        overflow-y: auto;
      }

      .home {
        height: auto;
        min-height: 100vh;
        overflow: visible;

        display: flex;
        flex-direction: column;

        padding-bottom: 50px;
      }

      .top-nav {
        position: relative;

        top: auto;
        left: auto;
        right: auto;

        padding: 28px 24px;

        font-size: 10px;
      }

      .navigation {
        gap: 20px;
      }

      .artwork {
        position: relative;

        left: auto;
        top: auto;
        bottom: auto;

        width: 92%;
        height: 72vh;
        min-height: 600px;

        margin: 0 auto;

        align-items: flex-end;
      }

      .artwork img {
        width: 100%;
        height: 100%;

        object-fit: contain;
        object-position: center bottom;
      }

      .intro {
        position: relative;

        left: auto;
        top: auto;

        width: auto;
        max-width: none;

        margin: 60px 24px 0;

        transform: none;
      }

      .name {
        font-size: clamp(68px, 14vw, 120px);

        white-space: normal;
      }

      .discipline {
        white-space: normal;

        line-height: 1.6;
      }

      .statement {
        margin-top: 50px;

        max-width: 480px;

        font-size: 16px;
      }

      .enter {
        width: 100%;
        max-width: 360px;

        margin-top: 45px;
      }

      .year-area {
        position: relative;

        left: auto;
        bottom: auto;

        margin: 90px 24px 0;
      }
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      .top-nav {
        padding: 22px 18px;
      }

      .location {
        font-size: 9px;
      }

      .navigation {
        gap: 12px;

        font-size: 9px;
      }

      .artwork {
        width: 100%;
        height: 67vh;
        min-height: 500px;
      }

      .intro {
        margin: 45px 18px 0;
      }

      .name {
        font-size: clamp(60px, 19vw, 95px);
      }

      .discipline {
        margin-top: 20px;

        font-size: 9px;
      }

      .statement {
        margin-top: 42px;

        font-size: 15px;

        line-height: 1.55;
      }

      .enter {
        margin-top: 40px;
      }

      .year-area {
        margin-left: 18px;
      }
    }

  </style>
</head>


<body>

  <main class="home">


    <!-- NAVIGATION -->

    <header class="top-nav">

      <div class="location">
        New York / Hong Kong
      </div>

      <nav class="navigation">

        <a href="work.html">
          Work
        </a>

        <a href="information.html">
          Information
        </a>

        <a href="mailto:cshushs1@gmail.com">
          Contact
        </a>

      </nav>

    </header>


    <!-- COLLAGE -->

    <div class="artwork">

      <img
        src="homepage-collage.png"
        alt="Chang Shu collage artwork"
      >

    </div>


    <!-- INTRO -->

    <section class="intro">

      <h1 class="name">
        Chang Shu
      </h1>


      <p class="discipline">
        Interaction · Digital Media · Visual Art
      </p>


      <p class="statement">
        Between reality and imagination, I build spaces to feel, to question, and to play.
      </p>


      <a
        href="work.html"
        class="enter"
      >

        <span class="enter-label">
          ENTER
        </span>

        <span class="enter-line"></span>

        <span class="arrow">
          →
        </span>

      </a>

    </section>


    <!-- YEAR -->

    <div class="year-area">

      <div class="red-line"></div>

      <div class="year">
        2026
      </div>

    </div>


  </main>

</body>
</html>
